[package]
name = "torpc-proxy-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Desktop GUI for ToRPC proxy using Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core library
torpc-proxy-core = { path = "../torpc-proxy-core" }

# Tauri 2.x — most features that were behind feature flags in 1.x are now
# either built-in (window/tray APIs) or split into separate plugin crates.
# `tauri-plugin-shell` will be added in PR 3 when we wire the update-
# notification "open releases page" action.
tauri = { version = "2", features = ["tray-icon"] }

# Async runtime
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Tor support for connection testing
tokio-socks = { workspace = true }

# Platform-specific directories for config storage
dirs = "5.0"

[features]
# This feature is used for production builds or when `frontendDist` points
# to the filesystem (Tauri 2.x renamed `devPath`/`distDir`).
custom-protocol = ["tauri/custom-protocol"]
