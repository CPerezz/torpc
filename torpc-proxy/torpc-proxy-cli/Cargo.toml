[package]
name = "torpc-proxy-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for ToRPC proxy"

[[bin]]
name = "torpc-proxy"
path = "src/main.rs"

[dependencies]
# Core library
torpc-proxy-core = { path = "../torpc-proxy-core" }

# Async runtime
tokio = { workspace = true }
tokio-socks = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Platform-specific config-dir resolution (matches the GUI's path).
dirs = "5.0"

# System integration
[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"