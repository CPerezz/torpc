name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Service-required tests are gated behind `#[ignore]` and run via
  # `make test-with-services` only. Keep CI service-free by NOT passing
  # --include-ignored anywhere in this workflow.
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  # clippy + test cover the full workspace including the Tauri 2.x GUI.
  # The migration flipped the system-lib stack from libwebkit2gtk-4.0 +
  # libsoup-2.4 (Ubuntu 22.04-only) to libwebkit2gtk-4.1 + libsoup-3.0
  # (native on Ubuntu 24.04), so we're back on the default `ubuntu-latest`
  # image. Keep the prefix-key cache isolation in place — it's good
  # hygiene regardless of which image we're on, and prevents future
  # image-version drift from poisoning caches.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-${{ env.ImageOS }}"
      - name: install Tauri 2.x system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-${{ env.ImageOS }}"
      - name: install Tauri 2.x system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: build
        run: cargo build --workspace
      - name: tests
        run: cargo test --workspace --tests

  # Mandatory: any new RUSTSEC vulnerability against a crate in `Cargo.lock`
  # fails the pipeline. Default cargo-audit behavior treats unmaintained /
  # unsound / yanked as informational warnings, which is the right balance
  # while a few transitives in our dep tree (notably from the Tauri stack)
  # haven't been revived yet.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit
